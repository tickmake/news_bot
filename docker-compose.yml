services:
  # Optional bundled Ollama, for hosts that do not already run one.
  # Off by default -- start it with:  docker compose --profile bundled-ollama up
  # If you already run an Ollama container named `ollama` (see
  # RANKER_NETWORK below), leave this profile off and the bot will use it.
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    container_name: news_bot_ollama
    restart: unless-stopped
    volumes:
      # Models are large; keep them out of the image and across restarts.
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Uncomment for NVIDIA GPU acceleration (needs nvidia-container-toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot model pull for the bundled Ollama. Same profile, so it only runs
  # when the bundled service does.
  ollama-pull:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    container_name: news_bot_ollama_pull
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list: with a list entrypoint, a *string* command is
    # shlex-split into separate args, so `sh -c` would receive only the first
    # word as its script. The model name is interpolated by compose at config
    # time, so `docker compose config` shows exactly what will run.
    command:
      - >
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 3; done;
        ollama pull '${NEWS_RANKER_MODEL:-qwen2.5:3b}'
    restart: "no"

  news-notifier:
    build: . # 👈 This tells Portainer to look for the Dockerfile in your Git repo
    container_name: daily_news_bot
    restart: unless-stopped
    # Hardening. The entrypoint starts as root only to chown the data volume
    # (older volumes are root-owned), then drops to the unprivileged `app` user
    # with no capabilities left. Nothing but the volume and /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN   # entrypoint: hand the data volume to `app`
      - SETUID  # entrypoint: drop to `app`
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      # Lets the bot resolve an Ollama running in another compose project.
      - ranker
    volumes:
      # Everything the bot needs to survive a recreate. Without this the
      # trade-history SQLite DB and the news dedup state live in the
      # container's writable layer, so `up --force-recreate` silently resets
      # qualifying streaks, /analyze outcomes and /stocks weekly picks to
      # empty until enough sessions re-accumulate.
      - news_bot_data:/app/data
    # The image carries no .env of its own (the Dockerfile copies only the code,
    # evaluation_universe.csv and the entrypoint), and the explicit `environment` list
    # below is an allowlist -- so every setting missing from it was simply
    # unset in the container. That is how the configured stock universes
    # (USA_/INDIA_/NORWAY_/EU_STOCK_UNIVERSE and the mutual-fund lists) never
    # reached the screener: they have no code default, so the trade screen
    # silently ran on screener-discovered movers alone.
    #
    # `required: false` so a host without a .env still starts. Anything also
    # named in `environment` below keeps that value -- compose gives the
    # explicit list precedence -- which is what keeps STATE_FILE and
    # TRADE_HISTORY_DB_FILE pinned to the volume regardless of .env.
    env_file:
      - path: .env
        required: false
    environment:
      # Deliberately NOT ${STATE_FILE:-...}: compose interpolates that from the
      # host .env, so a leftover `STATE_FILE=.news_bot_state.json` there would
      # silently put both files back in the container's writable layer and
      # quietly undo the volume above. The mount point is a property of this
      # compose file, not user config -- change it here if you need it moved.
      - STATE_FILE=/app/data/.news_bot_state.json
      - TRADE_HISTORY_DB_FILE=/app/data/.news_bot_trade_history.db
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      # Slack mirror. The image has no .env of its own, so anything absent from this
      # list is simply unset in the container -- and an unset webhook makes
      # send_slack_message() return early without logging, so the mirror goes
      # silently dead rather than erroring.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_MESSAGE_MAX_CHARS=${SLACK_MESSAGE_MAX_CHARS:-3900}
      # Chart uploads to Slack. The webhook above posts text only; a file
      # needs the Web API and a bot token with files:write. Still outbound
      # only -- no port is exposed. Unset means Slack keeps getting text.
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - FREENEWS_API_KEY=${FREENEWS_API_KEY}
      - FREEN_EWS_API_KEY=${FREEN_EWS_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FINHUB_API_KEY=${FINHUB_API_KEY}
      - NEWS_FETCH_PRIORITY=${NEWS_FETCH_PRIORITY}
      - FREENEWS_API_URL=${FREENEWS_API_URL}
      - FINNHUB_API_URL=${FINNHUB_API_URL}
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_LEVEL_LIBRARIES=${LOG_LEVEL_LIBRARIES:-WARNING}
      - LOG_COLOR=${LOG_COLOR:-true}
      # News ranking. `ollama` resolves to whichever Ollama is on the ranker
      # network -- the bundled service or a pre-existing container of that
      # name. If it is unreachable the briefing still renders via the
      # heuristic ranker, so this is never a hard dependency.
      - NEWS_RANKER_ENABLED=${NEWS_RANKER_ENABLED:-true}
      - NEWS_RANKER_URL=${NEWS_RANKER_URL:-http://ollama:11434}
      - NEWS_RANKER_MODEL=${NEWS_RANKER_MODEL:-qwen2.5:3b}
      # Measured on a Raspberry Pi 5 with a warm qwen2.5:3b: 14 candidates
      # ~107s, 20 ~236s. llama3.2:3b needs ~193s at 14 and exceeds the 240s
      # timeout at 20. Keep the shortlist small and the timeout generous.
      - NEWS_RANKER_TIMEOUT_SECONDS=${NEWS_RANKER_TIMEOUT_SECONDS:-240}
      - NEWS_RANKER_MAX_CANDIDATES=${NEWS_RANKER_MAX_CANDIDATES:-14}
      # The fetch pool stays wide so cross-outlet dedup and the heuristic keep
      # their breadth; only the LLM sees the shortlist above.
      - BRIEFING_BUDGET_SECONDS=${BRIEFING_BUDGET_SECONDS:-900}
      - NEWS_CANDIDATE_POOL_SIZE=${NEWS_CANDIDATE_POOL_SIZE:-60}
      - NEWS_MAX_AGE_HOURS=${NEWS_MAX_AGE_HOURS:-30}
      - NEWS_DEDUP_WINDOW_DAYS=${NEWS_DEDUP_WINDOW_DAYS:-7}
      - NEWS_RECENT_TITLE_DAYS=${NEWS_RECENT_TITLE_DAYS:-3}
      - NEWS_TOPIC_WEIGHTS=${NEWS_TOPIC_WEIGHTS}
      # Trade screener. Listed explicitly as well as via env_file so the
      # defaults are visible here rather than buried in the Python.
      - TRADE_UNIVERSE_MAX=${TRADE_UNIVERSE_MAX:-30}
      - TRADE_HISTORY_RETENTION_DAYS=${TRADE_HISTORY_RETENTION_DAYS:-14}
      - TRADE_OUTCOME_LOOKBACK_DAYS=${TRADE_OUTCOME_LOOKBACK_DAYS:-5}
      - TRADE_BACKTEST_PERIOD=${TRADE_BACKTEST_PERIOD:-2y}
      - TRADE_BACKTEST_UNIVERSE=${TRADE_BACKTEST_UNIVERSE:-configured}
      - TRADE_BACKTEST_UNIVERSE_MAX=${TRADE_BACKTEST_UNIVERSE_MAX:-100}
      - TRADE_BACKTEST_COST_BPS=${TRADE_BACKTEST_COST_BPS:-10}
      - TRADE_BACKTEST_HOLDOUT_START=${TRADE_BACKTEST_HOLDOUT_START:-}
      - TRADE_BACKTEST_MIN_AVG_VOLUME=${TRADE_BACKTEST_MIN_AVG_VOLUME:-100000}
      - TRADE_BACKTEST_BENCHMARKS=${TRADE_BACKTEST_BENCHMARKS:-DEFAULT:SPY,.NS:^NSEI,.BO:^BSESN,.OL:OSEBX.OL,.DE:^GDAXI,.PA:^FCHI,.AS:^AEX,.MI:FTSEMIB.MI,.MC:^IBEX,.BR:^BFX,.L:^FTSE,.SW:^SSMI,.ST:^OMX,.CO:^OMXC25,.HE:^OMXH25}
      - TRADE_WEEKLY_TOP_PICKS_LOOKBACK_DAYS=${TRADE_WEEKLY_TOP_PICKS_LOOKBACK_DAYS:-7}
      - TRADE_WEEKLY_TOP_PICKS_MIN_QUALIFYING_DAYS=${TRADE_WEEKLY_TOP_PICKS_MIN_QUALIFYING_DAYS:-2}
      # Universe continuity. /stocks reads recorded history, so it needs
      # symbols re-screened across several sessions; discovery alone churns
      # almost completely day to day. Tracked symbols are carried forward for
      # this many days, while discovery keeps a reserved slot count so new
      # names still surface.
      - TRADE_STICKY_UNIVERSE_DAYS=${TRADE_STICKY_UNIVERSE_DAYS:-10}
      - TRADE_DISCOVERY_MIN_SLOTS=${TRADE_DISCOVERY_MIN_SLOTS:-10}
      # Charts on /recommendations, sent to Telegram and, when SLACK_BOT_TOKEN and
      # SLACK_CHANNEL_ID are set, uploaded to Slack too.
      - TRADE_CHART_ENABLED=${TRADE_CHART_ENABLED:-true}
      - TRADE_CHART_COUNT=${TRADE_CHART_COUNT:-3}
      - TRADE_CHART_LOOKBACK_DAYS=${TRADE_CHART_LOOKBACK_DAYS:-90}
      # Risk analytics (sizing, clustering, earnings flags). See newsbot/risk.py.
      - RISK_ANALYTICS_ENABLED=${RISK_ANALYTICS_ENABLED:-true}
      - RISK_PER_TRADE_PCT=${RISK_PER_TRADE_PCT:-0.5}
      - RISK_STOP_ATR_MULTIPLE=${RISK_STOP_ATR_MULTIPLE:-2.0}
      - RISK_MAX_POSITION_PCT=${RISK_MAX_POSITION_PCT:-20}
      - RISK_MAX_TOTAL_PCT=${RISK_MAX_TOTAL_PCT:-60}
      - RISK_ACCOUNT_SIZE=${RISK_ACCOUNT_SIZE:-0}
      - RISK_CORR_THRESHOLD=${RISK_CORR_THRESHOLD:-0.7}
      - RISK_EARNINGS_WARN_DAYS=${RISK_EARNINGS_WARN_DAYS:-7}
      - RELATIVE_STRENGTH_ENABLED=${RELATIVE_STRENGTH_ENABLED:-true}
      - RELATIVE_STRENGTH_WINDOWS=${RELATIVE_STRENGTH_WINDOWS:-20,60}
      - CATALYSTS_ENABLED=${CATALYSTS_ENABLED:-true}
      - CATALYSTS_MAX_PER_PICK=${CATALYSTS_MAX_PER_PICK:-2}
      - CATALYSTS_MAX_AGE_HOURS=${CATALYSTS_MAX_AGE_HOURS:-36}
      # Market-data alerting: a Telegram message when too many symbols return no
      # data, or prices go stale. See newsbot/data_health.py.
      - MARKET_DATA_ALERTS_ENABLED=${MARKET_DATA_ALERTS_ENABLED:-true}
      - MARKET_DATA_ALERT_RATIO=${MARKET_DATA_ALERT_RATIO:-0.5}
      - MARKET_DATA_MAX_STALE_DAYS=${MARKET_DATA_MAX_STALE_DAYS:-6}
      # Watchlists. No code default -- unset here means the screener sees only
      # discovered movers and /watchlist has nothing to report.
      - USA_STOCK_UNIVERSE=${USA_STOCK_UNIVERSE}
      - INDIA_STOCK_UNIVERSE=${INDIA_STOCK_UNIVERSE}
      - NORWAY_STOCK_UNIVERSE=${NORWAY_STOCK_UNIVERSE}
      - EU_STOCK_UNIVERSE=${EU_STOCK_UNIVERSE}
      - INDIA_MUTUAL_FUNDS=${INDIA_MUTUAL_FUNDS}
      - NORWAY_MUTUAL_FUNDS=${NORWAY_MUTUAL_FUNDS}
    # json-file with no options grows without limit, and DEBUG accelerates it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only web page over the bot's database: browse tables, filter, export
  # CSV, run the ready-made reports in datasette/metadata.yml. The volume is
  # mounted read-only and Datasette opens the file read-only too, so nothing
  # here can change the bot's data. No login, so the port must stay on the
  # home network / VPN -- never forward it from the router.
  datasette:
    build: ./datasette
    container_name: news_bot_datasette
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - news_bot_data:/app/data:ro
      - ./datasette/metadata.yml:/etc/datasette/metadata.yml:ro
    command:
      - datasette
      - serve
      - /db/trade_history.db
      - --metadata=/etc/datasette/metadata.yml
      - --host=0.0.0.0
      - --port=8001
      - --setting
      - sql_time_limit_ms
      - "5000"
    ports:
      - "${DATASETTE_PORT:-8001}:8001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  # Network carrying the Ollama the bot should talk to.
  #
  # Default is the bundled service's own network. To reuse an Ollama from
  # another compose project, set RANKER_NETWORK to that project's network and
  # RANKER_NETWORK_EXTERNAL=true, e.g. in .env:
  #   RANKER_NETWORK=poster-bot_default
  #   RANKER_NETWORK_EXTERNAL=true
  # Find it with: docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' ollama
  ranker:
    name: ${RANKER_NETWORK:-daily-news-bot_ranker}
    external: ${RANKER_NETWORK_EXTERNAL:-false}

volumes:
  ollama_models:
  # Trade-history SQLite DB and news dedup state. Survives recreates; the
  # history is only as deep as TRADE_HISTORY_RETENTION_DAYS (14 by default).
  news_bot_data:
