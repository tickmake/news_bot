services:
  ollama:
    image: ollama/ollama:latest
    container_name: news_bot_ollama
    restart: unless-stopped
    volumes:
      # Models are large; keep them out of the image and across restarts.
      - ollama_models:/root/.ollama
    # Not published to the host by default — only the bot needs to reach it.
    # Uncomment to inspect the API from your machine:
    # ports:
    #   - "11434:11434"
    healthcheck:
      # The bot degrades to heuristic ranking if Ollama is down, so this gates
      # startup order only; it is not a hard dependency.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Uncomment for NVIDIA GPU acceleration (needs nvidia-container-toolkit).
    # Without this Ollama runs on CPU, which is slower but works.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot: pulls the ranking model into the shared volume, then exits.
  # Without this the first briefing falls back to heuristic ranking while
  # Ollama downloads the model on demand.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: news_bot_ollama_pull
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # Single-element list: with a list entrypoint, a *string* command is
    # shlex-split into separate args, so `sh -c` would receive only the first
    # word as its script. The model name is interpolated by compose at config
    # time, so `docker compose config` shows exactly what will run.
    command:
      - >
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama"; sleep 3; done;
        ollama pull '${NEWS_RANKER_MODEL:-qwen2.5:7b}'
    restart: "no"

  news-notifier:
    build: . # 👈 This tells Portainer to look for the Dockerfile in your Git repo
    container_name: daily_news_bot
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - FREENEWS_API_KEY=${FREENEWS_API_KEY}
      - FREEN_EWS_API_KEY=${FREEN_EWS_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FINHUB_API_KEY=${FINHUB_API_KEY}
      - NEWS_FETCH_PRIORITY=${NEWS_FETCH_PRIORITY}
      - FREENEWS_API_URL=${FREENEWS_API_URL}
      - FINNHUB_API_URL=${FINNHUB_API_URL}
      - TZ=${TZ}
      # News ranking. The bot reaches Ollama over the compose network; if it is
      # unreachable the briefing still renders via the heuristic ranker.
      - NEWS_RANKER_ENABLED=${NEWS_RANKER_ENABLED:-true}
      - NEWS_RANKER_URL=${NEWS_RANKER_URL:-http://ollama:11434}
      - NEWS_RANKER_MODEL=${NEWS_RANKER_MODEL:-qwen2.5:7b}
      - NEWS_RANKER_TIMEOUT_SECONDS=${NEWS_RANKER_TIMEOUT_SECONDS:-120}
      - NEWS_MAX_AGE_HOURS=${NEWS_MAX_AGE_HOURS:-30}
      - NEWS_CANDIDATE_POOL_SIZE=${NEWS_CANDIDATE_POOL_SIZE:-60}
      - NEWS_DEDUP_WINDOW_DAYS=${NEWS_DEDUP_WINDOW_DAYS:-7}
      - NEWS_RECENT_TITLE_DAYS=${NEWS_RECENT_TITLE_DAYS:-3}
      - NEWS_TOPIC_WEIGHTS=${NEWS_TOPIC_WEIGHTS}

volumes:
  ollama_models:
