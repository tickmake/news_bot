# Static server for the dashboard (docker-compose `dashboard`). /site is the
# volume dashboard-data writes: the Evidence SPA build plus a `data` symlink to
# the latest parquet release. Every route that is not a real file falls back to
# the one shell page, which renders the route in the browser.
server {
    listen 8080;
    root /site;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The data files keep their names when a refresh rewrites them, so the
    # browser must re-check them; hashed /_app assets can be cached for good.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /data/ { add_header Cache-Control "no-cache"; }
    location /_app/immutable/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
