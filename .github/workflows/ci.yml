name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (pyflakes rules only)
        run: |
          pip install ruff
          ruff check --select F news_bot.py newsbot test_news_bot.py test_hardening.py

      - name: Audit pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps

      - name: Run unit tests
        run: python -m unittest -v
