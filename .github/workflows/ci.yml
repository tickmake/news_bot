name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the oldest Python the code supports (ruff.toml targets py311);
        # 3.14 is what local development uses. The Python production runs is
        # tested in the docker job, inside the image itself.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (rules in ruff.toml)
        run: |
          pip install ruff
          ruff check news_bot.py newsbot tests

      - name: Audit pinned dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps

      - name: Run unit tests with coverage
        # ResourceWarning as an error catches leaked SQLite connections and files.
        run: |
          pip install coverage
          python -W error::ResourceWarning -m coverage run -m unittest -v
          python -m coverage report

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose file is valid, with and without the bundled Ollama
        # The unit tests read docker-compose.yml as text; this has Compose
        # parse it, so a schema error or a bad interpolation fails here.
        run: |
          docker compose config -q
          docker compose --profile bundled-ollama config -q

      - name: Build image
        run: docker build -t news-bot-ci .

      - name: Unit tests on the production Python, inside the image
        # The test job's matrix runs on setup-python interpreters. This runs the
        # same suite on the image's own interpreter and packages, so whatever the
        # Dockerfile pins is what gets tested. The image leaves tests out
        # (.dockerignore), so the checkout is mounted read-only; state and trade
        # history go to the tmpfs, as they go to the writable checkout in the
        # test job. As `app`, not root: two file-permission tests skip as root.
        run: |
          pinned="$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+)-.*/\1/p' Dockerfile)"
          image="$(docker run --rm news-bot-ci python -c 'import platform; print(platform.python_version())')"
          echo "Dockerfile pins python:$pinned; the image runs Python $image"
          test "${image%.*}" = "$pinned"
          docker run --rm --read-only --tmpfs /tmp --user app \
            -v "$PWD":/src:ro -w /src \
            -e STATE_FILE=/tmp/news_bot_state.json \
            -e TRADE_HISTORY_DB_FILE=/tmp/news_bot_trade_history.db \
            news-bot-ci python -W error::ResourceWarning -m unittest -v

      - name: Build dashboard image
        # A separate image with its own requirements; nothing else builds it.
        run: docker build -t news-bot-dashboard-ci ./streamlit

      - name: Open dashboards close at logout and expiry (real Streamlit)
        # Only the dashboard image has Streamlit, so the test job skips these.
        run: |
          docker run --rm --read-only --tmpfs /tmp -v "$PWD":/src:ro -w /src \
            -e PYTHONDONTWRITEBYTECODE=1 news-bot-dashboard-ci \
            python -m unittest -v tests.test_dashboard_websocket_live

      - name: Entrypoint drops privileges and fixes a root-owned volume
        run: |
          vol="$(mktemp -d)"
          # Simulate a volume left behind by an older, root-running image:
          # the directory and its files are owned by root.
          sudo sh -c "echo old > '$vol/.news_bot_state.json'"
          sudo chown root:root "$vol"
          sudo chmod 755 "$vol"
          docker run --rm --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -v "$vol":/app/data news-bot-ci \
            sh -c 'test "$(id -u)" = 10001 && echo "ok: running as $(id -un)" \
              && echo new > /app/data/written.txt && cat /app/data/.news_bot_state.json'

      - name: Application imports under the hardened runtime
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true \
            -e TELEGRAM_TOKEN=x -e TELEGRAM_CHAT_ID=1 \
            -e STATE_FILE=/app/data/.news_bot_state.json \
            -e TRADE_HISTORY_DB_FILE=/app/data/.news_bot_trade_history.db \
            -v news_bot_ci_data:/app/data news-bot-ci \
            python -c "import newsbot.bot, newsbot.charts as c; print('imports ok')"
